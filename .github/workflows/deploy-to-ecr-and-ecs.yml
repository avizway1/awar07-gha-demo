name: Build and Push to ECR

on:
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_DEF_NAME: ${{ secrets.ECS_TASK_DEF_NAME }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
  IMAGE_TAG: ${{ github.sha }}
  
jobs:
  build-and-push:
    name: Build Docker image & push it to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.set-image-uri.outputs.image_uri }}

    #Checkout the repo (Its picks the Dockerfile from the Repo)
    steps:
      - uses: actions/checkout@v6
        
    # Configuring AWS credentials
      - name: configure aws credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          
    # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
          
    # Set ECR registry env var
      - name: Set ECR Registry env var
        run: echo "ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_ENV
    # Buils, add a tag and then push to ECR
      - name: Build, tag and push to ecr repo
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          SHORT_TAG="v-${IMAGE_TAG::7}"
          
          echo "Building Docker image..."
          docker build -t $IMAGE_URI:$SHORT_TAG .
          docker tag $IMAGE_URI:$SHORT_TAG $IMAGE_URI:latest

          echo "Pushing to ECR.."
          docker push $IMAGE_URI:$SHORT_TAG
          docker push $IMAGE_URI:latest

          echo "IMAGE_FULL_URI=$IMAGE_URI:$SHORT_TAG" >> $GITHUB_ENV
          
      # Expose full image URI as a job ouput for the next jobs
      - name: Set Image URI as Job output
        id: set-image-uri
        run: echo "image_uri=$IMAGE_FULL_URI" >> $GITHUB_OUTPUT
        
  # Starting Job 2...      
  deploy-to-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_FULL_URI: ${{ needs.build-and-push.outputs.image_uri }}

    steps:
      - name: configure aws credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          
      # Download Existing ECS Task Definition
      - name: Download Existing Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEF_NAME \
            --query taskDefinition \
            > task-definition.json

          cat task-definition.json
        # Update Container Image in Task Definition
      - name: Update Container Image in Task Definition
        run: |
          echo "Updating ECS Task Definition with new image..."

          jq --arg IMAGE "$IMAGE_FULL_URI" \
             --arg CONTAINER "$ECS_CONTAINER_NAME" \
             '
             .containerDefinitions |=
             map(
               if .name == $CONTAINER
               then .image = $IMAGE
               else .
               end
             )
             |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )
             ' task-definition.json > new-task-definition.json

          echo "Updated Task Definition:"
          cat new-task-definition.json

      # Register New ECS Task Definition Revision
      - name: Register New ECS Task Definition
        id: register-task-def
        run: |
          echo "Registering new task definition revision..."

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

          echo "New Task Definition ARN:"
          echo $TASK_DEF_ARN

      # Deploy New Task Definition to ECS Service
      - name: Deploy to ECS Service
        run: |
          echo "Updating ECS Service..."

          aws ecs update-service \
            --cluster $ECS_CLUSTER_NAME \
            --service $ECS_SERVICE_NAME \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment

      # Wait Until ECS Service Becomes Stable
      - name: Wait for ECS Service Stability
        run: |
          echo "Waiting for ECS service deployment to stabilize..."

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER_NAME \
            --services $ECS_SERVICE_NAME

          echo "Deployment completed successfully."


        
