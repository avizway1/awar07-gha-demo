
name: Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_DEF_NAME: ${{ secrets.ECS_TASK_DEF_NAME }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build Docker image & push it to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          SHORT_TAG="v-${GITHUB_SHA::7}"
          FULL_IMAGE_URI="$IMAGE_URI:$SHORT_TAG"

          echo "Building Docker Image..."
          docker build -t $FULL_IMAGE_URI .

          echo "Tagging latest image..."
          docker tag $FULL_IMAGE_URI $IMAGE_URI:latest

          echo "Pushing Docker Images to ECR..."
          docker push $FULL_IMAGE_URI
          docker push $IMAGE_URI:latest

          echo "Generated Image URI:"
          echo "$FULL_IMAGE_URI"

          echo "image_uri=$FULL_IMAGE_URI" >> $GITHUB_OUTPUT

  deploy-to-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_FULL_URI: ${{ needs.build-and-push.outputs.image_uri }}

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Verify Image URI
        run: |
          echo "IMAGE_FULL_URI=$IMAGE_FULL_URI"

      - name: Download Existing ECS Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEF_NAME \
            --query taskDefinition \
            --output json > task-definition.json

          echo "Downloaded Existing Task Definition"

      - name: Update ECS Task Definition Image
        run: |
          echo "Updating container image..."

          jq --arg IMAGE "$IMAGE_FULL_URI" \
             --arg CONTAINER "$ECS_CONTAINER_NAME" \
             '
             .containerDefinitions = (
               .containerDefinitions | map(
                 if .name == $CONTAINER
                 then .image = $IMAGE
                 else .
                 end
               )
             )
             |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )
             ' task-definition.json > new-task-definition.json

          echo "Updated Task Definition:"
          cat new-task-definition.json

      - name: Validate Updated Image
        run: |
          echo "Validating container image update..."

          cat new-task-definition.json | jq '.containerDefinitions[] | {name,image}'

      - name: Register New Task Definition Revision
        id: register-task
        run: |
          echo "Registering new task definition revision..."

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

          echo "New Task Definition ARN:"
          echo "$TASK_DEF_ARN"

      - name: Deploy New Task Definition
        run: |
          echo "Deploying updated task definition to ECS Service..."

          aws ecs update-service \
            --cluster $ECS_CLUSTER_NAME \
            --service $ECS_SERVICE_NAME \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment

      - name: Wait for ECS Service Stability
        run: |
          echo "Waiting for ECS service stability..."

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER_NAME \
            --services $ECS_SERVICE_NAME

          echo "Deployment completed successfully"
