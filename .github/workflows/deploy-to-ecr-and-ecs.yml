name: Build and Push to ECR

on:
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME: ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_DEF_NAME: ${{ secrets.ECS_TASK_DEF_NAME }}
  ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}
  IMAGE_TAG: ${{ github.sha }}
  
jobs:
  build-and-push:
    name: Build Docker image & push it to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.set-image-uri.outputs.image_uri }}

    steps:
      - uses: actions/checkout@v4
        
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
          
      - name: Build, tag and push to ECR
        # FIX: Expand the step output of login-ecr using ${{ }} syntax directly
        # so ECR_REGISTRY is hardcoded into the script — not resolved at runtime
        # from a shell variable. This guarantees it's available to GITHUB_ENV.
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          SHORT_TAG="v-${IMAGE_TAG::7}"
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_TAG"

          echo "Building Docker image: $FULL_IMAGE_URI"
          docker build -t $FULL_IMAGE_URI .
          docker tag $FULL_IMAGE_URI $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushing to ECR..."
          docker push $FULL_IMAGE_URI
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Write individual pieces to GITHUB_ENV for the next step
          echo "ECR_REGISTRY=$ECR_REGISTRY"   >> $GITHUB_ENV
          echo "SHORT_TAG=$SHORT_TAG"          >> $GITHUB_ENV

      - name: Set Image URI as Job output
        id: set-image-uri
        # FIX: Reconstruct FULL_IMAGE_URI from ECR_REGISTRY + ECR_REPOSITORY + SHORT_TAG
        # All three are now guaranteed to be set (ECR_REGISTRY and SHORT_TAG via
        # GITHUB_ENV from the previous step; ECR_REPOSITORY from workflow-level env).
        run: |
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_TAG"

          echo "------- DEBUG -------"
          echo "ECR_REGISTRY   = $ECR_REGISTRY"
          echo "ECR_REPOSITORY = $ECR_REPOSITORY"
          echo "SHORT_TAG      = $SHORT_TAG"
          echo "FULL_IMAGE_URI = $FULL_IMAGE_URI"
          echo "---------------------"

          if [ -z "$ECR_REGISTRY" ] || [ -z "$ECR_REPOSITORY" ] || [ -z "$SHORT_TAG" ]; then
            echo "ERROR: One or more source variables is empty. Cannot build image URI."
            exit 1
          fi

          echo "image_uri=$FULL_IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Job output set: image_uri=$FULL_IMAGE_URI"
        
  # ─────────────────────────────────────────────────────────────
  deploy-to-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      IMAGE_FULL_URI: ${{ needs.build-and-push.outputs.image_uri }}

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Verify Image URI is not empty
        run: |
          echo "Image URI received from build job: $IMAGE_FULL_URI"
          if [ -z "$IMAGE_FULL_URI" ]; then
            echo "ERROR: IMAGE_FULL_URI is empty. Check the build job set-image-uri step logs."
            exit 1
          fi
          
      - name: Download Existing Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEF_NAME \
            --query taskDefinition \
            > task-definition.json

          echo "Current Task Definition:"
          cat task-definition.json

      - name: Update Container Image in Task Definition
        run: |
          echo "Updating ECS Task Definition with new image: $IMAGE_FULL_URI"

          jq --arg IMAGE "$IMAGE_FULL_URI" \
             --arg CONTAINER "$ECS_CONTAINER_NAME" \
             '
             .containerDefinitions |=
             map(
               if .name == $CONTAINER
               then .image = $IMAGE
               else .
               end
             )
             |
             del(
               .taskDefinitionArn,
               .revision,
               .status,
               .requiresAttributes,
               .compatibilities,
               .registeredAt,
               .registeredBy
             )
             ' task-definition.json > new-task-definition.json

          echo "Updated Task Definition:"
          cat new-task-definition.json

      - name: Register New ECS Task Definition
        id: register-task-def
        run: |
          echo "Registering new task definition revision..."

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV
          echo "New Task Definition ARN: $TASK_DEF_ARN"

      - name: Deploy to ECS Service
        run: |
          echo "Updating ECS Service..."

          aws ecs update-service \
            --cluster $ECS_CLUSTER_NAME \
            --service $ECS_SERVICE_NAME \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment

      - name: Wait for ECS Service Stability
        run: |
          echo "Waiting for ECS service deployment to stabilize..."

          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER_NAME \
            --services $ECS_SERVICE_NAME

          echo "Deployment completed successfully."
