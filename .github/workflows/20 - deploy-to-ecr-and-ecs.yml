name: Build and Deploy to ECR and ECS

on:
  workflow_dispatch:

# OIDC auth requires these two permissions
permissions:
  id-token: write
  contents: read

# Non-sensitive config lives in repo Variables so it is not masked in logs.
# Only the role ARN stays a secret.
env:
  AWS_REGION:         ${{ vars.AWS_REGION }}
  ECR_REPO_NAME:      ${{ vars.ECR_REPO_NAME }}
  ECS_CLUSTER_NAME:   ${{ vars.ECS_CLUSTER_NAME }}
  ECS_SERVICE_NAME:   ${{ vars.ECS_SERVICE_NAME }}
  ECS_TASK_DEF_NAME:  ${{ vars.ECS_TASK_DEF_NAME }}
  ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}

jobs:
  deploy:
    name: Build, push to ECR and deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # OIDC replaces long-lived AWS_ACCESS_KEY + AWS_SECRET_KEY.
      # Requires a trust policy on the IAM role for token.actions.githubusercontent.com.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region:     ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      # Required for cache-to/cache-from type=gha: the runner's default docker
      # driver cannot export cache, only the docker-container driver can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:v-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # Pulls the current task definition straight from ECS (task-definition-family)
      # and writes a patched copy with the new image. No describe + jq needed.
      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.ECS_TASK_DEF_NAME }}
          container-name:         ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO_NAME }}:v-${{ github.sha }}

      # Registers the new revision, updates the service and waits for it to
      # stabilize. Strips the read-only fields that jq used to delete by hand.
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.render.outputs.task-definition }}
          cluster:                    ${{ env.ECS_CLUSTER_NAME }}
          service:                    ${{ env.ECS_SERVICE_NAME }}
          wait-for-service-stability: true
